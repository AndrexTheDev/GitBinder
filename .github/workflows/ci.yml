name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint the module graph (no unused exports policy is manual)
        run: npm test

      - name: Build the static bundle
        run: npm run build

      - name: Upload the bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
