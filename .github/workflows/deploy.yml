name: Deploy to Cloudflare Pages

# Disabled by default: enable by renaming this file's trigger (below) and adding
# the two repository secrets. Deploying from the Cloudflare dashboard needs none
# of this — connect the repo, set build command `npm run build`, output `dist`.
on:
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gitbooklet
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
