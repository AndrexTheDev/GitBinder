<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GitBooklet">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232935"/>
      <stop offset="1" stop-color="#161b25"/>
    </linearGradient>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAD094"/>
      <stop offset="0.5" stop-color="#CF9A37"/>
      <stop offset="1" stop-color="#B87F24"/>
    </linearGradient>
  </defs>

  <!-- Book cover -->
  <rect x="10" y="8" width="44" height="48" rx="5" fill="url(#cover)"/>
  <!-- Spine -->
  <rect x="10" y="8" width="6" height="48" rx="5" fill="#0d1119" opacity="0.85"/>
  <rect x="16.5" y="10" width="1.4" height="44" fill="url(#gilt)" opacity="0.75"/>

  <!-- Open pages -->
  <path d="M22 20 L52 20 L48 24 L22 24 Z" fill="#f7f2e8"/>
  <path d="M22 28 L50 28 L46 32 L22 32 Z" fill="#f7f2e8" opacity="0.9"/>
  <path d="M22 36 L48 36 L44 40 L22 40 Z" fill="#f7f2e8" opacity="0.8"/>

  <!-- Gilded rule -->
  <rect x="24" y="45" width="22" height="2" rx="1" fill="url(#gilt)"/>
</svg>
