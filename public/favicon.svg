<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GitBinder">
  <title>GitBinder</title>
  <!--
    Favicon variant of the GitBinder mark.

    A deliberately simplified drawing rather than the full mark: browsers
    rasterise a favicon at 16–32 px, where the combed page edges, the
    stitching and the spine's raised bands all collapse into noise. What
    survives that size is the silhouette, the branch, and the navy/cream
    contrast — so that is all this file contains.

    The detailed version lives in `brand/mark.svg` and is used wherever there
    is room for it.
  -->
  <rect x="13" y="4" width="38" height="56" rx="6" fill="#1E3A5F" />
  <g fill="none" stroke="#F8F3E4" stroke-width="5" stroke-linecap="round">
    <path d="M32 19v26" />
    <path d="M32 26 21 32M32 34 43 40M32 42 21 48" />
  </g>
  <g fill="#F8F3E4">
    <circle cx="32" cy="18" r="4.4" />
    <circle cx="32" cy="45" r="4.4" />
    <circle cx="19.6" cy="32.4" r="3.8" />
    <circle cx="44.4" cy="40.4" r="3.8" />
    <circle cx="19.6" cy="48.4" r="3.8" />
  </g>
  <rect x="24" y="53" width="16" height="4" rx="2" fill="#C08A2E" />
</svg>
