<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 214" width="64" height="214" role="img" aria-label="GitBinder">
  <title>GitBinder</title>
  <!--
    Favicon variant of the GitBinder spine.

    Not a scaled copy of `brand/mark.svg`, because at 16–32 px the full mark
    is unreadable: the spine is under 8 px wide there, so the comb, the
    stitching, the subtitle and both imprint lines all collapse into noise.

    What survives a favicon is silhouette and contrast, so this file keeps the
    spine, the two bands, a cream title bar standing in for the lettering, the
    stem with its nodes, and the roll at the foot. Nothing else.
  -->
  <path fill="#1A3A63" d="M9.5 8H54.5A3.5 3.5 0 0 1 58 11.5V203Q32 208.6 6 203V11.5A3.5 3.5 0 0 1 9.5 8Z" />
  <rect fill="#1A3A63" x="2" y="34.6" width="60" height="3.4" rx="1.7" />
  <rect fill="#1A3A63" x="2" y="176.4" width="60" height="3.4" rx="1.7" />
  <!-- Cream coverage is deliberately heavy. At 16 px one SVG unit is about
       seven hundredths of a pixel, so anything thinner than these blocks
       disappears into the navy entirely. -->
  <g fill="#F8F3E4">
    <rect x="12" y="44" width="40" height="9" rx="1" />
    <rect x="17" y="58" width="30" height="9" rx="1" />
    <rect x="30" y="74" width="4" height="88" rx="2" />
    <circle cx="32" cy="74" r="6.5" />
    <circle cx="32" cy="162" r="6.5" />
    <circle cx="25.6" cy="104" r="5.2" />
    <circle cx="38.4" cy="132" r="5.2" />
  </g>
</svg>
